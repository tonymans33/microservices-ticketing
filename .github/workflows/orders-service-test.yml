name: orders-service tests

on:
  pull_request:
    paths:
      - 'orders-service/**'
      - '.github/workflows/orders-service-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: orders-service
      - run: npm run test:ci
        working-directory: orders-service
