apiVersion: apps/v1
kind: Deployment
metadata: 
  name: orders-service-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: us.gcr.io/ticketing-dev-504919/orders-service
          env:
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: 'http://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: 'ticketing'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: COOKIE_SECURE
              value: 'false'
            - name: MONGO_URI
              value: 'mongodb://orders-mongo-srv:27017/orders'
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service-srv
spec:
  selector:
    app: orders-service
  ports:
    - name: orders-service
      protocol: TCP
      port: 8000
      targetPort: 8000
